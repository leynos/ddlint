[package]
name = "fixture-lints"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Lint-scoped attribute helper for rstest fixture expansions"
license = "ISC"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0.119", features = ["full"] }

[dev-dependencies]
rstest = "0.28"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
