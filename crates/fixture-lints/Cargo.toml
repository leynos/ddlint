[package]
name = "fixture-lints"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Lint-scoped attribute helper for rstest fixture expansions"
license = "ISC"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0.9", features = ["full"] }

[dev-dependencies]
rstest = "0.28"

[lints]
workspace = true
