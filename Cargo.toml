[package]
name = "ddlint"
version = "0.1.0"
edition = "2024"

[dependencies]
rowan = { version = "0.17", default-features = false }
num-derive = { version = "0.5", default-features = false }
num-traits = { version = "0.2", default-features = false, features = ["std"] }
num-bigint = { version = "0.5", default-features = false, features = ["std"] }
logos = { version = "0.13", default-features = false, features = ["export_derive"] }
phf = { version = "0.14", default-features = false, features = ["macros"] }
chumsky = { version = "0.9", default-features = false, features = ["std"] }
log = { version = "0.4", default-features = false }
thiserror = { version = "1.0", default-features = false }
derive_more = { version = "2.1", default-features = false, features = ["from", "as_ref"] }
rayon = "1.10"
smallvec = "1.15.1"
metrics = { version = "0.24.6", default-features = false, optional = true }
tracing = { version = "0.1.44", default-features = false, optional = true }

[features]
observability = ["dep:metrics", "dep:tracing", "tracing/std"]
test-support = []

[dev-dependencies]
rstest = "0.28"
insta = "1.47.2"
ddlint = { path = ".", features = ["test-support"] }
proptest = "1.6.0"
trybuild = "1.0.114"

[dev-dependencies.metrics-util]
version = "0.20.4"
default-features = false
features = ["debugging"]

# Development builds keep neither incremental state nor debug information (rule
# `rust-dev-build-footprint`, DF-001 and DF-002). Set CARGO_PROFILE_DEV_DEBUG=true
# to debug, or CARGO_INCREMENTAL=1 to rebuild incrementally.
[profile.dev]
incremental = false
debug = 0

[lints.rust]
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(clippy_policy_negative)'] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# 1. hygiene
allow_attributes                    = "deny"
allow_attributes_without_reason     = "deny"
blanket_clippy_restriction_lints    = "deny"

# 2. debugging leftovers
dbg_macro       = "deny"
print_stdout    = "deny"
print_stderr    = "deny"

# 3. panic-prone operations
unwrap_used                     = "deny"
expect_used                     = "deny"
indexing_slicing                = "deny"
string_slice                    = "deny"
integer_division                = "deny"
integer_division_remainder_used = "deny"

# 4. portability
host_endian_bytes   = "deny"
little_endian_bytes = "deny"
big_endian_bytes    = "deny"

# 5. nursery idiom polish
or_fun_call            = "deny"
option_if_let_else     = "deny"
use_self               = "deny"
string_lit_as_bytes    = "deny"

# 6. numerical foot-guns
float_arithmetic = "deny"
