[package]
name = "ddlint"
version = "0.1.0"
edition = "2024"
description = "Differential Datalog linter"
license = "ISC"
repository = "https://github.com/leynos/ddlint"

[workspace]
members = ["cli", "crates/fixture-lints"]
default-members = [".", "cli", "crates/fixture-lints"]
resolver = "3"

[dependencies]
rowan = { version = "0.17", default-features = false }
num-derive = { version = "0.5", default-features = false }
num-traits = { version = "0.2", default-features = false, features = ["std"] }
num-bigint = { version = "0.5", default-features = false, features = ["std"] }
logos = { version = "0.13", default-features = false, features = ["export_derive"] }
phf = { version = "0.14", default-features = false, features = ["macros"] }
chumsky = { version = "0.13", default-features = false, features = ["std"] }
log = { version = "0.4", default-features = false }
thiserror = { version = "1.0", default-features = false }
derive_more = { version = "2.1", default-features = false, features = ["from", "as_ref"] }
rayon = "1.10"
smallvec = "1.15.1"
metrics = { version = "0.24.6", default-features = false, optional = true }
tracing = { version = "0.1.44", default-features = false, optional = true }

[features]
observability = ["dep:metrics", "dep:tracing", "tracing/std"]
test-support = []

[dev-dependencies]
fixture-lints = { path = "crates/fixture-lints" }
rstest = "0.28"
rstest-bdd = "0.6.0"
rstest-bdd-macros = "0.6.0"
insta = "1.47.2"
ddlint = { path = ".", features = ["test-support"] }
proptest = "1.6.0"
trybuild = "1.0.114"
googletest = "0.14.4"
pretty_assertions = "1.4.1"
cap-std = { version = "4.0.3", features = ["fs_utf8"] }
camino = "1.2.6"

[dev-dependencies.metrics-util]
version = "0.20.4"
default-features = false
features = ["debugging"]

# Development builds keep neither incremental state nor debug information (rule
# `rust-dev-build-footprint`, DF-001 and DF-002). Set CARGO_PROFILE_DEV_DEBUG=true
# to debug, or CARGO_INCREMENTAL=1 to rebuild incrementally.
[profile.dev]
incremental = false
debug = 0

[lints]
workspace = true

[workspace.lints.rust]
unknown_lints = "deny"
renamed_and_removed_lints = "deny"
unsafe_code = "forbid"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(clippy_policy_negative)'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# 1. hygiene
allow_attributes                 = "deny"
allow_attributes_without_reason  = "deny"
blanket_clippy_restriction_lints = "deny"
cognitive_complexity             = "deny"
# The method list is not yet part of the shared baseline; the lint stays armed
# so that adding one takes effect for every member at once.
disallowed_methods               = "deny"
needless_pass_by_value           = "deny"
implicit_hasher                  = "deny"
missing_assert_message           = "deny"

# 2. debugging leftovers
dbg_macro    = "deny"
print_stdout = "deny"
print_stderr = "deny"

# 3. panic-prone operations
unwrap_used                     = "deny"
expect_used                     = "deny"
indexing_slicing                = "deny"
string_slice                    = "deny"
integer_division                = "deny"
integer_division_remainder_used = "deny"
panic_in_result_fn              = "deny"
unreachable                     = "deny"

# 4. portability
host_endian_bytes   = "deny"
little_endian_bytes = "deny"
big_endian_bytes    = "deny"

# 5. nursery idiom polish
let_underscore_must_use = "deny"
or_fun_call             = "deny"
option_if_let_else      = "deny"
self_named_module_files = "deny"
shadow_reuse            = "deny"
shadow_same             = "deny"
shadow_unrelated        = "deny"
str_to_string           = "deny"
string_lit_as_bytes     = "deny"
try_err                 = "deny"
unneeded_field_pattern  = "deny"
use_self                = "deny"

# 6. numerical foot-guns
float_arithmetic         = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap       = "deny"
cast_precision_loss      = "deny"
lossy_float_literal      = "deny"

# 7. API ergonomics
missing_const_for_fn = "deny"
must_use_candidate   = "deny"
unused_async         = "deny"

# 8. Error handling
missing_panics_doc = "deny"
error_impl_error   = "deny"
result_large_err   = "deny"

[workspace.lints.rustdoc]
missing_crate_level_docs     = "deny"
broken_intra_doc_links       = "deny"
private_intra_doc_links      = "deny"
bare_urls                    = "deny"
invalid_html_tags            = "deny"
invalid_codeblock_attributes = "deny"
unescaped_backticks          = "deny"
