[package]
name = "ddlint-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

# The bin shares its name with the root `ddlint` library target, so documenting
# both writes to `target/doc/ddlint/` and Cargo warns about a filename collision
# (rust-lang/cargo#6313). The binary has no public API of its own and defers to
# the library, so only the library target is documented.
[[bin]]
name = "ddlint"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "4.5.41", features = ["derive"] }
ddlint = { path = ".." }
ortho_config = "0.10.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.17"

[dev-dependencies]
cap-std = "4.0.2"
proptest = "1.6.0"
rstest = "0.28"
tempfile = "3.23.0"

[lints]
workspace = true
